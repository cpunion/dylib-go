name: Go
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Go native / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-amd64, arch: x64, languages: 'rust,zig,fortran,go'}
          - {os: ubuntu-24.04-arm, target: linux-arm64, arch: arm64, languages: 'rust,zig,fortran,go'}
          - {os: macos-15-intel, target: darwin-amd64, arch: x64, languages: 'rust,zig,fortran,swift,go'}
          - {os: macos-15, target: darwin-arm64, arch: arm64, languages: 'rust,zig,fortran,swift,go'}
          - {os: windows-2022, target: windows-amd64, arch: x64, languages: 'go'}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      DYLIB_TEST_REQUIRE_NATIVE: '1'
      DYLIB_TEST_REQUIRE_SHARED: '1'
      DYLIB_TEST_REQUIRE_TOOLS: '1'
      DYLIB_TEST_LANGUAGES: ${{ matrix.languages }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          architecture: ${{ matrix.arch }}
          cache: false
      - if: runner.os != 'Windows'
        run: bash scripts/ci-unix-deps.sh
      - if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.os != 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-binutils mingw-w64-clang-x86_64-libffi mingw-w64-clang-x86_64-pkgconf
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Add-Content $env:GITHUB_PATH (Join-Path $env:MSYS2_ROOT 'clang64/bin')
          Add-Content $env:GITHUB_ENV 'CC=clang'
      - name: Toolchain identity
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          clang --version
          pkg-config --modversion libffi
      - name: Execute C/C++, archives, shared libraries and selected language interfaces
        run: go test -count=1 -v -tags libffi ./...
      - name: Race and lifetime checks
        env:
          DYLIB_TEST_LANGUAGES: ''
        run: go test -count=1 -race -tags libffi ./...
      - run: go vet -tags libffi ./...

  inspection:
    name: Go pure / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-amd64, arch: x64}
          - {os: ubuntu-24.04-arm, target: linux-arm64, arch: arm64}
          - {os: ubuntu-24.04, target: linux-386, arch: '386'}
          - {os: macos-15-intel, target: darwin-amd64, arch: x64}
          - {os: macos-15, target: darwin-arm64, arch: arm64}
          - {os: windows-2022, target: windows-amd64, arch: x64}
          - {os: windows-11-arm, target: windows-arm64, arch: arm64}
          - {os: windows-2022, target: windows-386, arch: '386'}
    env:
      CGO_ENABLED: '0'
      DYLIB_TEST_REQUIRE_TOOLS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          architecture: ${{ matrix.arch }}
          cache: false
      - name: Run parser and unsupported-target tests in the target process
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
          go test -count=1 -v ./...
          go build ./cmd/ddlgo
      - name: Record unavailable macOS 386 toolchain port
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          if go tool dist list | grep -qx darwin/386; then
            echo 'darwin/386 now exists: add its execution job'; exit 1
          fi
          echo 'darwin/386: unsupported by the Go toolchain; no execution claim' >> "$GITHUB_STEP_SUMMARY"
